<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PROYECTO STAR WARS - COMPARAR</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-orange-200">
    <div class="container mx-auto p-6">
        
        <div id="seccion-comparacion" class="bg-amber-120 rounded-3xl p-6 shadow-xl mb-5 hidden">
            <h2 class="text-2xl font-bold text-center mb-4">COMPARACION</h2>
            <table class="w-full bg-white border border-gray-300 rounded-xl overflow-hidden">
                <thead>
                    <tr class="bg-amber-570 text-red">
                        <th class="p-3 text-left">CARACTERÍSTICA</th>
                        <th id="nombre-p1" class="p-3 text-center">PERSONAJE 1</th>
                        <th id="nombre-p2" class="p-3 text-center">PERSONAJE 2</th>
                    </tr>
                </thead>
                <tbody id="tabla-cuerpo">
                    </tbody>
            </table>
            <div class="text-center mt-4">
                <button id="boton-limpiar" class="bg-red-600 text-white px-4 py-2 rounded font-bold hover:bg-red-700">
                    LIMPIAR
                </button>
            </div>
        </div>

        <div class="bg-amber-500 rounded-3xl p-6 shadow-xl">
            <h1 class="text-4xl text-center font-bold mb-8">PERSONAJES STAR WARS</h1>
            
            <div class="text-center mb-6">
                <button id="boton-anterior" class="bg-black text-white px-4 py-2 rounded">ANTERIOR</button>
                <span id="texto-pagina" class="mx-4 font-bold">PAGINA 1</span>
                <button id="boton-siguiente" class="bg-black text-white px-4 py-2 rounded">SIGUIENTE</button>
            </div>

            <div id="lista-personajes" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
        </div>

    </div>

    <script src="index.js"></script>
</body>
</html>
